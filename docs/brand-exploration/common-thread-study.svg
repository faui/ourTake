<text x="60" y="60" font-family="Arial,sans-serif" font-size="16" fill="#66636A" >COMMON THREAD / INDEPENDENT STUDY 02</text>
<text x="60" y="120" font-family="Arial,sans-serif" font-size="48" fill="#25252C" >We each bring a strand.</text>
<text x="60" y="158" font-family="Arial,sans-serif" font-size="21" fill="#66636A" >Two contributions. One woven window. Room for our moment.</text>

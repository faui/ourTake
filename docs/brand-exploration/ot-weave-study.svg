<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1020"><rect width="1500" height="1020" fill="#F4EDE3"/><text x="55" y="55" font-family="Arial,sans-serif" font-size="16" fill="#24313A">ourTake / O + T / NEGATIVE-SPACE STUDY 03</text><text x="55" y="115" font-family="Arial,sans-serif" font-size="46" fill="#24313A">What the weave leaves open.</text><text x="55" y="155" font-family="Arial,sans-serif" font-size="20" fill="#656361">Three readings of the initials. The woven-window concept remains the reference.</text><text x="55" y="226" font-family="Arial,sans-serif" font-size="23" fill="#24313A">01 / Shared counter</text><rect x="55" y="260" width="410" height="340" rx="20" fill="#FEFCF7"/><g transform="translate(125 295) scale(2.7)"><path fill-rule="evenodd" fill="#214F68" d="M50 8A42 42 0 1 1 50 92A42 42 0 1 1 50 8Z M25 28H75V42H57V74H43V42H25Z"/></g><text x="55" y="642" font-family="Arial,sans-serif" font-size="17" fill="#24313A">O: the enclosing silhouette</text><text x="55" y="673" font-family="Arial,sans-serif" font-size="15" fill="#656361">T: the central aperture</text><g transform="translate(67 723) scale(.90)" style="color:#214F68"><path fill-rule="evenodd" fill="currentColor" d="M50 8A42 42 0 1 1 50 92A42 42 0 1 1 50 8Z M25 28H75V42H57V74H43V42H25Z"/></g><g transform="translate(205 723) scale(.90)"><path fill-rule="evenodd" fill="#214F68" d="M50 8A42 42 0 1 1 50 92A42 42 0 1 1 50 8Z M25 28H75V42H57V74H43V42H25Z"/><path fill="#F0B56B" fill-opacity=".72" d="M25 28H75V42H57V74H43V42H25Z"/></g><text x="60" y="848" font-family="Arial,sans-serif" font-size="14" fill="#656361">One color</text><text x="188" y="848" font-family="Arial,sans-serif" font-size="14" fill="#656361">Letter reading</text><text x="55" y="903" font-family="Arial,sans-serif" font-size="17" fill="#24313A">Strongest negative-space discovery.</text><text x="55" y="931" font-family="Arial,sans-serif" font-size="16" fill="#656361">The weave becomes subtle.</text><text x="550" y="226" font-family="Arial,sans-serif" font-size="23" fill="#24313A">02 / Threaded initials</text><rect x="550" y="260" width="410" height="340" rx="20" fill="#FEFCF7"/><g transform="translate(620 295) scale(2.7)"><g fill="none" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round"><path stroke="#214F68" d="M50 26A28 28 0 1 0 67 45"/><path stroke="#BB4C34" d="M32 18H90M60 18V62M60 82V92"/></g></g><text x="550" y="642" font-family="Arial,sans-serif" font-size="17" fill="#24313A">O + T: two interlaced strokes</text><text x="550" y="673" font-family="Arial,sans-serif" font-size="15" fill="#656361">O counter + breathing room at the crossing</text><g transform="translate(562 723) scale(.90)" style="color:#214F68"><g fill="none" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round"><path stroke="currentColor" d="M50 26A28 28 0 1 0 67 45"/><path stroke="currentColor" d="M32 18H90M60 18V62M60 82V92"/></g></g><g transform="translate(700 723) scale(.90)"><g fill="none" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round"><path stroke="#214F68" d="M50 26A28 28 0 1 0 67 45"/><path stroke="#BB4C34" d="M32 18H90M60 18V62M60 82V92"/></g><ellipse cx="40" cy="52" rx="17" ry="20" fill="#F0B56B" fill-opacity=".72"/><path d="M32 18H90M60 18V92" fill="none" stroke="#F0B56B" stroke-opacity=".7" stroke-width="4"/></g><text x="555" y="848" font-family="Arial,sans-serif" font-size="14" fill="#656361">One color</text><text x="683" y="848" font-family="Arial,sans-serif" font-size="14" fill="#656361">Letter reading</text><text x="550" y="903" font-family="Arial,sans-serif" font-size="17" fill="#24313A">Best continuity with weaving.</text><text x="550" y="931" font-family="Arial,sans-serif" font-size="16" fill="#656361">Letter reading is more explicit.</text><text x="1045" y="226" font-family="Arial,sans-serif" font-size="23" fill="#24313A">03 / Open initials</text><rect x="1045" y="260" width="410" height="340" rx="20" fill="#FEFCF7"/><g transform="translate(1115 295) scale(2.7)